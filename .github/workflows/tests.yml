name: Scientific checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements-app.lock.txt
          python -m pip install --no-deps -e .
      - name: Run offline scientific and artifact checks
        run: python -m unittest discover -s tests -v
      - name: Regenerate validation figures from committed tables
        run: python -m india_weather.plots
      - name: Verify browser model parity against Python fixtures
        run: node dashboard/scripts/test-portable.mjs
