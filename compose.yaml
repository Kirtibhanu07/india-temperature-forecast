services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["weather-cache:/app/data/live_cache"]
    restart: unless-stopped
  dashboard:
    build: .
    command: ["streamlit", "run", "frontend.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      WEATHER_BACKEND_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3)"]
      interval: 30s
      timeout: 4s
    restart: unless-stopped
volumes:
  weather-cache:
